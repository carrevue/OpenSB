<style>
    .video-player {
        position: relative;
        width: 100%;
        height: 100%;
    }

    .video-controls {
        z-index: 50;
        display: block;
        position: absolute;
        bottom: 0;
        width: 100%;
    }

    .player-progress-bar {
        background: #cc181e;
        height: 8px;
    }

    .player-chrome {
        background: #1B1B1B;
        height: 27px;
        display: flex;
        align-items: center;
    }

    .player-button {
        cursor: pointer;
    }

    .player-button-play {
        background: green;
        width: 55px;
        height: 27px;
    }

    .player-button-pause {
        background: yellow;
        width: 55px;
        height: 27px;
    }

    .player-time-display {
        font-size: 11px;
        color: white;
    }
</style>
<div id="video-player" class="video-player">
    <div class="video-container"></div>
    <div class="video-controls">
        <div class="player-progress-bar">

        </div>
        <div class="player-chrome">
            <div class="player-button player-button-play"></div>
            <div class="player-time-display">incomplete!</div>
        </div>
    </div>
